<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d12"><title>盲区 · 温热的缺席</title><meta name="description" content="四场景悬疑叙事游戏。检查遗留物、拍摄与显影、核对档案，用真实证据找回被修改的记忆。"><link rel="stylesheet" href="style.css"></head><body>
